<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Future secure account portal for StavaTech.">
<meta name="theme-color" content="#050705">
<link rel="icon" type="image/png" href="assets/logo1.png">
<link rel="stylesheet" href="style.css">
<title>Account Portal | STAVATECH</title>
</head>
<body>
<main>
<section class="login-page">
<div class="login-card">
<a class="brand" href="index.html">
<img src="assets/logobg.png" alt="STAVATECH">
</a>
<p class="eyebrow">Account portal</p>
<h1 style="font-size:clamp(2.4rem,6vw,4rem)">Secure access.</h1>
<div class="notice">This GitHub Pages website has no authentication backend. This screen is a future integration preview and will not transmit or store credentials.</div>
<form id="loginForm">
<div class="field">
<label for="login-email">Email address</label>
<input type="email" id="login-email" autocomplete="username" required>
</div>
<div class="field">
<label for="login-password">Password</label>
<input type="password" id="login-password" autocomplete="current-password" required>
</div>
<button class="btn btn--primary" type="submit">Check portal status</button>
</form>
<a class="back-link" href="index.html">← Return to public website</a>
</div>
</section>
</main>
<div class="toast" role="status" aria-live="polite">
</div>
<script src="script.js">
</script>
</body>
</html>
